[package]
name = "app"
# Not the app version — that lives in tauri.conf.json, which is what names the
# DMG and fills CFBundleShortVersionString. Nothing reads this one.
version = "0.0.0"
description = "A personal, local-first log of short work notes"
authors = ["Rafael Passos"]
license = "MIT"
repository = "https://github.com/rp-pipecodes/work-journal-ai"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# The calendar an Import reads, and the wake notification that makes it look
# again — see src-tauri/src/calendar.rs.
objc2-event-kit = { version = "0.3", features = [
    "EKEventStore",
    "EKEvent",
    "EKCalendar",
    "EKCalendarItem",
    "EKParticipant",
    "EKSource",
    "EKTypes",
    "EKStructuredLocation",
] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSDate",
    "NSArray",
    "NSSet",
    "NSTimeZone",
    "NSCalendar",
    "NSError",
    "NSDictionary",
    "NSValue",
    "NSPredicate",
    "NSObject",
    "NSBundle",
    "NSURL",
] }
block2 = "0.6"
# The Task Alerts macOS holds and delivers on its own — see
# src-tauri/src/alerts.rs and docs/adr/0017-the-os-schedules-task-alerts.md.
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNUserNotificationCenter",
    "UNNotificationRequest",
    "UNNotificationContent",
    "UNNotificationTrigger",
    "UNNotificationSettings",
    "UNNotificationResponse",
    "UNNotification",
    "UNNotificationSound",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
